<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Phantom Illusions Studio</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Phantom Illusions</div>
<ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="apps.html">Apps</a></li>
    <li><a href="software.html">Software</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li><a href="login.html" class="active">Login</a></li>
</ul>
        </nav>
    </header>

    <main>
        <section class="login-container">
            <div class="login-card">
                <h1>Admin Login</h1>
                <p>Access the Phantom Illusions Studio admin portal</p>

                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>

                    <button type="submit" id="login-btn" class="login-btn">
                        <span id="login-text">Login</span>
                        <span id="login-spinner" style="display: none;">...</span>
                    </button>
                </form>

                <div id="login-message" class="login-message"></div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Phantom Illusions Studio. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabaseClient.js"></script>
    <script src="assets/js/dataService.js"></script>
    <script src="assets/js/login.js"></script>
</body>
</html>
