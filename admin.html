<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Phantom Illusions Studio</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Phantom Illusions</div>
<ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="apps.html">Apps</a></li>
    <li><a href="software.html">Software</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li><a href="login.html">Login</a></li>
</ul>
        </nav>
    </header>

    <main>
        <section class="admin-container">
            <h1>Admin Portal</h1>

            <div id="admin-content">
                <div class="loading">Authenticating and loading admin interface...</div>
            </div>

            <div id="admin-form" class="admin-form" style="display: none;">
                <h2>Manage Items</h2>

                <form id="item-form">
                    <input type="hidden" id="item-id">

                    <div class="form-group">
                        <label for="item-type">Item Type:</label>
                        <select id="item-type" required>
                            <option value="app">App</option>
                            <option value="game">Game</option>
                            <option value="software">Software</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="distribution-type">Distribution Type:</label>
                        <select id="distribution-type" required>
                            <option value="file">File</option>
                            <option value="link">Link</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="name">Name:</label>
                        <input type="text" id="name" required>
                    </div>

                    <div class="form-group">
                        <label for="short-description">Short Description:</label>
                        <input type="text" id="short-description" required>
                    </div>

                    <div class="form-group">
                        <label for="full-description">Full Description:</label>
                        <textarea id="full-description" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="version">Version:</label>
                        <input type="text" id="version" required>
                    </div>

                    <div class="form-group">
                        <label for="release-date">Release Date:</label>
                        <input type="date" id="release-date" required>
                    </div>

                    <div class="form-group" id="file-upload-group">
                        <label for="file-upload">File Upload:</label>
                        <input type="file" id="file-upload">
                    </div>

                    <div class="form-group" id="external-url-group" style="display: none;">
                        <label for="external-url">External URL:</label>
                        <input type="url" id="external-url">
                    </div>

                    <div class="form-group">
                        <label for="icon-upload">Icon Upload:</label>
                        <input type="file" id="icon-upload" accept="image/*">
                    </div>

                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="is-featured">
                            Featured Item
                        </label>
                    </div>

                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="is-published" checked>
                            Published
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="save-btn">Save Item</button>
                        <button type="button" id="cancel-btn" style="display: none;">Cancel</button>
                    </div>
                </form>

                <div class="items-list">
                    <h3>Existing Items</h3>
                    <div id="items-table">
                        <div class="loading">Loading items...</div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Phantom Illusions Studio. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabaseClient.js"></script>
    <script src="assets/js/dataService.js"></script>
    <script src="assets/js/admin.js"></script>
</body>
</html>
